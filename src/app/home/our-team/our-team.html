<div id="overlay">
    <app-top-banner [title]='title'></app-top-banner>
    <div class="row" style="margin: 25px;">
        <div *ngFor="let team of teams" class="column-team">
            <div class="flip-card">
                <div class="flip-card-inner">
                    <div class="flip-card-front">
                    <img [src]="team.link" alt="Avatar" style="width:100%; height:100%;">
                    </div>
                    <div class="flip-card-back">
                    <h1>{{team.name}}</h1> 
                    <p>{{team.designation}}</p> 
                    <p>{{team.comment}}</p>
                    </div>
                </div>
            </div>
        </div>
        
    </div>
</div>
