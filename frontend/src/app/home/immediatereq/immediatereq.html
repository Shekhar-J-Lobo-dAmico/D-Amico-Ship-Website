<div id="overlay">
    <app-top-banner [title]='title'></app-top-banner>
    <div class="card bg-light mb-3" style="max-width: 100%">
        <h1 style="text-align: center; margin-top: 3%; font-size: 3dvh;">ROME FLEET</h1>
        <div style="margin: 2%; height: fit-content;">
            <div class="card-body">
                <table class="table table-hover">
                    <thead>
                        <tr>
                            <th scope="col">Rank</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr *ngFor="let job of romeJobList, let i = index " class="table-secondary" (click)="jobSelected(job.rank, 'rome')" style="max-height: 50px;">
                            <td>{{job.rank}}</td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>
    <div class="card bg-light mb-3" style="max-width: 100%">
        <h1 style="text-align: center; margin-top: 3%; font-size: 3dvh;">SINGAPORE FLEET</h1>
        <div style="margin: 2%; height: fit-content;">
            <div class="card-body">
                <table class="table table-hover">
                    <thead>
                        <tr>
                            <th scope="col">Rank</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr *ngFor="let job of singJobList, let i = index " class="table-secondary" (click)="jobSelected(job.rank, 'sing')" style="max-height: 50px;">
                            <td>{{job.rank}}</td>
                        </tr>
                    </tbody>
                </table>
                <br><br>
            </div>
        </div>
    </div>
</div>
